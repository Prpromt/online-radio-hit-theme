<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Онлайн Радио Хит — плеер</title>
<meta name="description" content="Встраиваемый плеер Онлайн Радио Хит.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
:root{--bg:#111216;--white:#fff;--pink:#ff2875;--muted:#b8bbc4;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--white)}body{display:flex;align-items:center;justify-content:center;padding:14px}.embed{width:min(100%,720px);border:1px solid var(--line);border-radius:20px;overflow:hidden;background:linear-gradient(145deg,#17181e,#0d0e12);box-shadow:0 16px 45px rgba(0,0,0,.24)}.top{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}.brand{font-size:14px;font-weight:900;letter-spacing:.02em}.brand b{color:var(--pink)}.live{font-size:10px;font-weight:900;color:var(--pink);letter-spacing:.08em}.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);margin-right:5px}.main{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:18px}.cover{width:120px;aspect-ratio:1;border-radius:15px;background:linear-gradient(145deg,#222530,#ff2875);display:grid;place-items:center;font-size:27px;font-weight:900;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.kicker{font-size:9px;font-weight:900;color:var(--pink);letter-spacing:.12em;margin:4px 0 8px}.title{font-size:clamp(22px,4vw,34px);line-height:1;margin:0 0 7px;overflow-wrap:anywhere}.artist{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.controls{display:flex;align-items:center;gap:9px;padding:0 18px 16px}.controls button{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#111216;display:grid;place-items:center;cursor:pointer}.controls .play{width:56px;height:56px;background:var(--pink);color:#fff;border-color:#fff;font-size:21px}.controls button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}.controls button.active{box-shadow:inset 0 0 0 2px var(--pink);color:var(--pink)}.icon{display:block;width:0;height:0}.prev{border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:11px solid currentColor}.next{border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid currentColor}.repeat:before{content:'↻';font-size:20px;font-weight:900}.play:before{content:'▶';font-size:18px}.play.is-pause:before{content:'Ⅱ';font-size:18px}.controls .spacer{flex:1}.volume{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted)}input[type=range]{accent-color:var(--pink);width:100%}.volume input{width:120px}.progress{padding:0 18px 15px}.times{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:4px}.footer{padding:10px 18px;background:rgba(255,255,255,.035);font-size:9px;color:var(--muted)}@media(max-width:520px){body{padding:0}.embed{width:100%;border-radius:0;border-left:0;border-right:0}.main{grid-template-columns:86px 1fr;gap:13px;padding:15px}.cover{width:86px;border-radius:12px}.controls{padding-left:15px;padding-right:15px}.controls .spacer{display:none}.volume{margin-left:auto}.volume input{width:82px}.volume span{display:none}.controls button{width:36px;height:36px}.controls .play{width:50px;height:50px}.footer{padding:9px 15px}}
</style>
</head>
<body>
<div class="embed" aria-label="Встраиваемый плеер Онлайн Радио Хит">
  <div class="top"><div class="brand">ОНЛАЙН РАДИО <b>ХИТ</b></div><div class="live"><i></i>LIVE 24/7</div></div>
  <div class="main"><div class="cover" id="cover">ХИТ</div><div><div class="kicker">СЕЙЧАС ИГРАЕТ</div><h1 class="title" id="title">Онлайн Радио Хит</h1><div class="artist" id="artist">Эфир 24/7</div></div></div>
  <div class="controls"><button id="repeat" aria-label="Повтор"><span class="icon repeat"></span></button><button id="prev" aria-label="Предыдущий"><span class="icon prev"></span></button><button class="play" id="play" aria-label="Воспроизвести"></button><button id="next" aria-label="Следующий"><span class="icon next"></span></button><div class="spacer"></div><label class="volume"><span>Громкость</span><input id="volume" type="range" min="0" max="1" value="0.8" step="0.01" aria-label="Громкость"></label></div>
  <div class="progress"><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div><input id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Позиция воспроизведения"></div>
  <div class="footer">Онлайн Радио Хит — официальный встраиваемый плеер</div>
  <audio id="audio" preload="metadata" src="/assets/demo.wav"></audio>
</div>
<script>
(()=>{const a=document.getElementById('audio'),p=document.getElementById('play'),v=document.getElementById('volume'),r=document.getElementById('progress'),cur=document.getElementById('current'),dur=document.getElementById('duration');if(!a)return;const repeatBtn=document.getElementById('repeat'),cover=document.getElementById('cover'),title=document.getElementById('title'),artist=document.getElementById('artist');const songs=[['Ночной город','KARAT','/assets/covers/night-city.svg'],['Jumanji','KARAT & МЛАДШИЙ','/assets/covers/jumanji.svg'],['Ты такая славная','Вячеслав Калинин','/assets/covers/slavnaya.svg'],['Просто я ищу тебя','Новый артист','/assets/covers/iskayu.svg'],['Летуаль','PELIKUANA','/assets/covers/letual.svg'],['Когда расцветает сирень','Андрей Додонов','/assets/covers/siren.svg']];let i=0,repeat=false;const fmt=s=>Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';function set(n,auto){i=(n+songs.length)%songs.length;title.textContent=songs[i][0];artist.textContent=songs[i][1];cover.innerHTML='<img src="'+songs[i][2]+'" alt="Обложка '+songs[i][0]+'" onerror="this.remove();cover.textContent=\'ХИТ\'">';a.currentTime=0;if(auto)a.play().catch(()=>{})}function sync(){const on=!a.paused;p.classList.toggle('is-pause',on);p.setAttribute('aria-label',on?'Пауза':'Воспроизвести');cur.textContent=fmt(a.currentTime);dur.textContent=fmt(a.duration);if(a.duration)r.value=a.currentTime/a.duration*100}p.onclick=()=>a.paused?a.play().catch(()=>{}):a.pause();v.oninput=()=>a.volume=Number(v.value);document.getElementById('prev').onclick=()=>set(i-1,true);document.getElementById('next').onclick=()=>set(i+1,true);repeatBtn.onclick=()=>{repeat=!repeat;repeatBtn.classList.toggle('active',repeat);repeatBtn.setAttribute('aria-pressed',repeat)};r.oninput=()=>{if(a.duration)a.currentTime=r.value/100*a.duration};a.addEventListener('play',sync);a.addEventListener('pause',sync);a.addEventListener('timeupdate',sync);a.addEventListener('loadedmetadata',sync);a.addEventListener('ended',()=>repeat?a.play().catch(()=>{}):set(i+1,true));a.volume=.8;set(0,false);sync()})();
</script>
</body>
</html>
