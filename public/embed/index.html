<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Онлайн Радио Хит — плеер</title><meta name="description" content="Встраиваемый плеер Онлайн Радио Хит."><meta name="referrer" content="strict-origin-when-cross-origin">
<style>
:root{--bg:#f5f6f8;--panel:#111216;--panel2:#191a20;--white:#fff;--pink:#ff2875;--acid:#dfff18;--muted:#b8bbc4;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--white)}body{display:flex;align-items:center;justify-content:center;padding:18px}.embed{width:min(760px,100%);border:1px solid rgba(0,0,0,.08);border-radius:24px;overflow:hidden;background:linear-gradient(145deg,var(--panel2),#0d0e12);box-shadow:0 18px 55px rgba(17,18,22,.22)}.top{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)}.brand{font-size:14px;font-weight:900;letter-spacing:.04em}.brand b{color:var(--pink)}.live{font-size:10px;font-weight:900;color:var(--pink);letter-spacing:.08em}.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);margin-right:5px;box-shadow:0 0 0 4px rgba(255,40,117,.1)}.main{display:grid;grid-template-columns:136px 1fr;gap:20px;padding:20px}.cover{width:136px;aspect-ratio:1;border-radius:17px;background:linear-gradient(135deg,var(--acid),#c6dc2e 35%,#1a1c22 36%,#1a1c22 62%,var(--pink) 63%);display:grid;place-items:center;font-size:29px;font-weight:900;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.kicker{font-size:9px;font-weight:900;color:var(--pink);letter-spacing:.14em;margin:8px 0}.title{font-size:clamp(24px,4vw,38px);line-height:.98;margin:0 0 7px;overflow-wrap:anywhere;letter-spacing:-.04em}.artist{font-size:14px;color:var(--muted);overflow-wrap:anywhere}.controls{display:flex;align-items:center;gap:9px;padding:0 20px 17px}.controls button{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#111216;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}.controls button:hover{transform:translateY(-1px)}.controls .play{width:58px;height:58px;background:var(--pink);color:#fff;border-color:var(--pink);font-size:0;box-shadow:0 8px 20px rgba(255,40,117,.25)}.controls button:focus-visible{outline:2px solid var(--acid);outline-offset:3px}.controls button.active{box-shadow:inset 0 0 0 2px var(--pink);color:var(--pink)}.prev:before,.next:before{content:"";display:block;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent}.prev:before{border-right:11px solid currentColor}.next:before{border-left:11px solid currentColor}.repeat:before{content:'↻';font-size:20px;font-weight:900}.play:before{content:'▶';font-size:18px;margin-left:3px}.play.is-pause:before{content:'Ⅱ';font-size:18px;margin-left:0}.spacer{flex:1}.volume{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted);min-width:145px}.volume input{width:105px}.progress{padding:0 20px 17px}.times{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:4px}input[type=range]{accent-color:var(--pink);cursor:pointer}.progress input{width:100%}.footer{padding:11px 20px;background:rgba(255,255,255,.035);font-size:9px;color:var(--muted)}@media(max-width:620px){body{padding:8px}.embed{width:100%;border-radius:18px}.main{grid-template-columns:92px 1fr;gap:14px;padding:16px}.cover{width:92px;border-radius:13px}.controls{padding:0 16px 15px;gap:7px}.controls button{width:38px;height:38px}.controls .play{width:52px;height:52px}.spacer{display:none}.volume{margin-left:auto;min-width:0;gap:0}.volume span{display:none}.volume input{width:88px}.progress{padding-left:16px;padding-right:16px}.footer{padding:9px 16px}}@media(max-width:400px){.main{grid-template-columns:78px 1fr;padding:13px;gap:11px}.cover{width:78px}.title{font-size:23px}.controls{padding-left:13px;padding-right:13px}.controls button{width:35px;height:35px}.controls .play{width:48px;height:48px}.volume input{width:70px}.progress{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>
<div class="embed" aria-label="Встраиваемый плеер Онлайн Радио Хит">
<div class="top"><div class="brand">ОНЛАЙН РАДИО <b>ХИТ</b></div><div class="live"><i></i>LIVE 24/7</div></div>
<div class="main"><div class="cover" id="cover">ХИТ</div><div><div class="kicker">СЕЙЧАС ИГРАЕТ</div><h1 class="title" id="title">Онлайн Радио Хит</h1><div class="artist" id="artist">Эфир 24/7</div></div></div>
<div class="controls"><button id="repeat" aria-label="Повтор" aria-pressed="false"><span class="repeat"></span></button><button id="prev" aria-label="Предыдущий"><span class="prev"></span></button><button class="play" id="play" aria-label="Воспроизвести"></button><button id="next" aria-label="Следующий"><span class="next"></span></button><div class="spacer"></div><label class="volume"><span>Громкость</span><input id="volume" type="range" min="0" max="1" value="0.8" step="0.01" aria-label="Громкость"></label></div>
<div class="progress"><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div><input id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Позиция воспроизведения"></div>
<div class="footer">Онлайн Радио Хит — официальный встраиваемый плеер</div>
<audio id="audio" preload="metadata" src="/assets/demo.wav"></audio>
</div>
<script>
(()=>{const a=document.getElementById('audio'),p=document.getElementById('play'),v=document.getElementById('volume'),r=document.getElementById('progress'),cur=document.getElementById('current'),dur=document.getElementById('duration'),repeatBtn=document.getElementById('repeat'),cover=document.getElementById('cover'),title=document.getElementById('title'),artist=document.getElementById('artist');if(!a)return;const songs=[['Ночной город','KARAT','/assets/covers/night-city.svg'],['Jumanji','KARAT & МЛАДШИЙ','/assets/covers/jumanji.svg'],['Ты такая славная','Вячеслав Калинин','/assets/covers/slavnaya.svg'],['Просто я ищу тебя','Новый артист','/assets/covers/iskayu.svg'],['Летуаль','PELIKUANA','/assets/covers/letual.svg'],['Когда расцветает сирень','Андрей Додонов','/assets/covers/siren.svg']];let i=0,repeat=false;const fmt=s=>Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';function set(n,auto){i=(n+songs.length)%songs.length;title.textContent=songs[i][0];artist.textContent=songs[i][1];cover.innerHTML='<img src="'+songs[i][2]+'" alt="Обложка '+songs[i][0]+'">';const img=cover.querySelector('img');img.onerror=()=>{cover.textContent='ХИТ'};a.currentTime=0;if(auto)a.play().catch(()=>{})}function sync(){const on=!a.paused;p.classList.toggle('is-pause',on);p.setAttribute('aria-label',on?'Пауза':'Воспроизвести');cur.textContent=fmt(a.currentTime);dur.textContent=fmt(a.duration);if(a.duration)r.value=a.currentTime/a.duration*100}p.onclick=()=>a.paused?a.play().catch(()=>{}):a.pause();v.oninput=()=>a.volume=Number(v.value);document.getElementById('prev').onclick=()=>set(i-1,true);document.getElementById('next').onclick=()=>set(i+1,true);repeatBtn.onclick=()=>{repeat=!repeat;repeatBtn.classList.toggle('active',repeat);repeatBtn.setAttribute('aria-pressed',String(repeat))};r.oninput=()=>{if(a.duration)a.currentTime=r.value/100*a.duration};a.addEventListener('play',sync);a.addEventListener('pause',sync);a.addEventListener('timeupdate',sync);a.addEventListener('loadedmetadata',sync);a.addEventListener('ended',()=>repeat?a.play().catch(()=>{}):set(i+1,true));a.volume=.8;set(0,false);sync()})();
</script>
</body></html>
