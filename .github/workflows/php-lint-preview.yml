name: PHP Lint Preview

on:
  push:
    branches:
      - cloudflare-preview
    paths:
      - '**/*.php'
      - 'assets/*.js'
      - '.github/workflows/php-lint-preview.yml'
  pull_request:
    branches:
      - cloudflare-preview
    paths:
      - '**/*.php'
      - 'assets/*.js'
      - '.github/workflows/php-lint-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -type f -name '*.php' -not -path './.git/*' -print)
          test -n "$files"
          for file in $files; do
            echo "Linting $file"
            php -l "$file"
          done

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/app.js
          node --check public/assets/app.js
