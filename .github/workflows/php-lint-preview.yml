name: PHP Lint Preview

on:
  push:
    branches:
      - cloudflare-preview
    paths:
      - 'wordpress-theme/**/*.php'
      - 'wordpress-theme/assets/*.js'
      - 'public/assets/*.js'
      - '.github/workflows/php-lint-preview.yml'
  pull_request:
    branches:
      - cloudflare-preview
    paths:
      - 'wordpress-theme/**/*.php'
      - 'wordpress-theme/assets/*.js'
      - 'public/assets/*.js'
      - '.github/workflows/php-lint-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Repair known PHP syntax regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wordpress-theme/functions.php')
          s=p.read_text(encoding='utf-8')
          bad="$canonical=is_front_page()?home_url('/'):(is_singular()||is_post_type_archive()||is_tax()||is_category()||is_tag()?get_permalink()?:home_url('/'));"
          good="$canonical=''; if(is_front_page())$canonical=home_url('/'); elseif(is_singular()||is_post_type_archive()||is_tax()||is_category()||is_tag())$canonical=get_permalink()?:home_url('/'); else $canonical=home_url('/');"
          if bad in s:
              p.write_text(s.replace(bad,good,1),encoding='utf-8')
          PY
          if ! git diff --quiet -- wordpress-theme/functions.php; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add wordpress-theme/functions.php
            git commit -m 'Fix PHP syntax regression in SEO canonical logic'
            git push origin HEAD:cloudflare-preview
          fi

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=$(find wordpress-theme -type f -name '*.php' -print)
          test -n "$files"
          for file in $files; do
            echo "Linting $file"
            php -l "$file"
          done

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check wordpress-theme/assets/app.js
          node --check public/assets/app.js
