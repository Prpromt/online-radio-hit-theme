name: Deploy Cloudflare Preview

on:
  push:
    branches:
      - cloudflare-preview
    paths:
      - 'public/**'
      - 'src/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-cloudflare-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PREVIEW_URL: https://online-radio-hit-theme.musickinoproducer.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v5

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config wrangler.toml

      - name: Smoke test Preview
        shell: bash
        run: |
          set -euo pipefail
          check_url() {
            local path="$1"
            local expected="$2"
            echo "Checking ${PREVIEW_URL}${path}"
            body=$(curl --fail --silent --show-error --location --max-time 20 "${PREVIEW_URL}${path}")
            printf '%s' "$body" | grep -Fq "$expected"
          }
          check_url "/health" "ok"
          check_url "/" "ОНЛАЙН РАДИО ХИТ"
          check_url "/embed/" "ВСТРАИВАЕМЫЙ ПЛЕЕР"
          check_url "/embed-code/" "Код для вставки на сайт"

      - name: Deployment complete
        run: echo "Cloudflare preview deployment and smoke tests completed successfully."