name: Deploy Cloudflare Preview

on:
  push:
    branches:
      - cloudflare-preview
    paths:
      - 'public/**'
      - 'src/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-cloudflare-preview.yml'
      - 'wordpress-theme/**'
      - '*.php'
      - 'theme/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PREVIEW_URL: https://online-radio-hit-theme.musickinoproducer.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v5

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config wrangler.toml

      - name: Smoke test Preview
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_QUERY="?orh_smoke=$(date +%s)"
          check_url() {
            local path="$1"
            local expected="$2"
            echo "Checking ${PREVIEW_URL}${path}${SMOKE_QUERY}"
            body=$(curl --fail --silent --show-error --location --max-time 20 "${PREVIEW_URL}${path}${SMOKE_QUERY}")
            printf '%s' "$body" | grep -Fq "$expected"
          }
          check_header() {
            local path="$1"
            local header="$2"
            local expected="$3"
            echo "Checking header ${header} on ${PREVIEW_URL}${path}${SMOKE_QUERY}"
            headers=$(curl --fail --silent --show-error --location --max-time 20 -D - -o /dev/null "${PREVIEW_URL}${path}${SMOKE_QUERY}" | tr -d '\r')
            if ! printf '%s\n' "$headers" | grep -Eiq "^${header}[[:space:]]*:[[:space:]]*${expected}[[:space:]]*$"; then
              echo "Expected header was not found. Received headers:"
              printf '%s\n' "$headers"
              return 1
            fi
          }
          check_header_contains() {
            local path="$1"
            local header="$2"
            local expected="$3"
            echo "Checking header ${header} contains '${expected}' on ${PREVIEW_URL}${path}${SMOKE_QUERY}"
            headers=$(curl --fail --silent --show-error --location --max-time 20 -D - -o /dev/null "${PREVIEW_URL}${path}${SMOKE_QUERY}" | tr -d '\r')
            if ! printf '%s\n' "$headers" | grep -Eiq "^${header}[[:space:]]*:[[:space:]].*${expected}"; then
              echo "Expected header directive was not found. Received headers:"
              printf '%s\n' "$headers"
              return 1
            fi
          }
          check_url "/health" "ok"
          check_url "/" "ОНЛАЙН РАДИО ХИТ"
          check_url "/" "Возможности артистов"
          check_url "/artist-levels/" "УРОВЕНЬ 01"
          check_url "/artist-levels/" "Стоимость"
          check_url "/artist-apply/" "РАЗМЕЩЕНИЕ В ЭФИРЕ"
          check_url "/artist-apply/" "Отправить заявку на размещение"
          check_url "/artist-apply/" "политикой конфиденциальности"
          check_url "/embed/" "Онлайн Радио Хит"
          check_url "/embed-code/" "Код для вставки на сайт"
          check_header "/" "X-Content-Type-Options" "nosniff"
          check_header "/" "Referrer-Policy" "strict-origin-when-cross-origin"
          check_header_contains "/" "Content-Security-Policy" "default-src 'self'"

      - name: Deployment complete
        run: echo "Cloudflare preview deployment and smoke tests completed successfully."
